<script>
<!-- Filter galeri -->
const tombolFilter = document.querySelectorAll('.filter');
const semuaFoto = document.querySelectorAll('.foto');

tombolFilter.forEach(tombol => {
  tombol.addEventListener('click', () => {
    const pilihan = tombol.dataset.filter;

    tombolFilter.forEach(t => {
      t.classList.remove('aktif');
      t.setAttribute('aria-pressed', 'false');
    });
    tombol.classList.add('aktif');
    tombol.setAttribute('aria-pressed', 'true');

    semuaFoto.forEach(foto => {
      const cocok = pilihan === 'semua' || foto.dataset.kategori === pilihan;
      foto.classList.toggle('sembunyi', !cocok);
    });
  });
});
<script/>
